[pytest]
# Put the repo root on sys.path so `from cybersec_mcp import ...` resolves
# without installing the package. pytest does NOT do this by default when the
# tests live in a directory with no __init__.py — it inserts tests/ on the path,
# not the rootdir. Requires pytest >= 7.0.
pythonpath = .

asyncio_mode = auto
testpaths = tests
addopts = -q
